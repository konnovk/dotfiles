# Включить поддержку мыши (скроллинг, переключение панелей и изменение их размера)
set -g mouse on

# Увеличить историю буфера до 10 000 строк
set -g history-limit 10000

# Начинать нумерацию окон и панелей с 1, а не с 0 (удобнее нажимать на клавиатуре)
set -g base-index 1
setw -g pane-base-index 1


# Создавать сплиты в текущей директории активной панели
bind-key % split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Сначала переключаемся между панелями, а на краю — между окнами
bind-key -n M-Left  if-shell -F '#{pane_at_left}'  'previous-window' 'select-pane -L'
bind-key -n M-Right if-shell -F '#{pane_at_right}' 'next-window'     'select-pane -R'
bind-key -n M-h     if-shell -F '#{pane_at_left}'  'previous-window' 'select-pane -L'
bind-key -n M-l     if-shell -F '#{pane_at_right}' 'next-window'     'select-pane -R'

bind-key -n M-Up    'select-pane -U'
bind-key -n M-Down  'select-pane -D'
bind-key -n M-k     'select-pane -U'
bind-key -n M-j     'select-pane -D'

# Статусбар в палитре Adwaita Dark
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=#1d1d20,fg=#ffffff"

# Слева — текущая сессия
set -g status-left-length 40
set -g status-left "#[fg=#1d1d20,bg=#8ff0a4,bold]  #S  #[default]"

# Справа — хост, заряд батареи, дата и время
set -g status-right-length 100
set -g status-right "#[fg=#9a9996]#H #[fg=#454545]│ #[fg=#8ff0a4]#(~/.config/tmux/battery.sh) #[fg=#454545]│ #[fg=#deddda]%d.%m.%Y #[fg=#454545]│ #[fg=#8ff0a4,bold]%H:%M "

# Список окон по центру
set -g status-justify centre
set -g window-status-separator ""
set -g window-status-format "#[fg=#9a9996] #I:#W "
set -g window-status-current-format "#[fg=#1d1d20,bg=#ffffff,bold] #I:#W #[default]"

# Сообщения и рамки панелей в той же палитре
set -g message-style "bg=#303030,fg=#ffffff"
set -g pane-border-style "fg=#454545"
set -g pane-active-border-style "fg=#8ff0a4"

