# background_opacity 1.7
# background_blur 5

font_family Cascadia Mono NF Light
font_size 16

hide_window_decorations yes
startup_mode fullscreen

# BEGIN_KITTY_THEME
# Adwaita dark
include current-theme.conf
# END_KITTY_THEME

# Синхронизировать отрисовку с частотой обновления монитора (включено по умолчанию)
sync_to_monitor yes

# Задержка между перерисовками экрана в мс (по умолчанию 10 мс, что дает ~100 FPS).
# Для 144-240 Гц можно снизить до 4-6 мс, чтобы полностью раскрыть герцовку при анимациях.
repaint_delay 5

# Задержка обработки ввода в мс (по умолчанию 3 мс). Можно снизить до 1-2 мс.
input_delay 2

# Форма курсора (block, beam, underline) и эффект следа при движении
cursor_shape            block
cursor_trail            1
cursor_trail_decay 0.05 0.15
cursor #999999
# Классический эффект старого монитора (сканлайны, искривление, свечение)
custom_shaders toggle-crt
map alt+s shader_event vhs_toggle
